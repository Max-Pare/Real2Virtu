[project]
name = "r2v"
version = "0.1.0"
description = "Interior video to walkable Godot map (Gaussian splats + collision proxy)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "trimesh>=4.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# GPU stages (splat, collision). Use Python 3.11 or 3.12: open3d and gsplat
# wheels lag behind newer interpreters. RTX 50-series needs a CUDA 12.8+ torch build.
gpu = [
    "torch>=2.7",
    "gsplat>=1.4",
    "open3d>=0.19",
]
# AMD Radeon on Linux (ROCm) instead of `gpu`. gsplat is not listed: it is built
# from AMD's fork by scripts/build_amd_gsplat.sh after `uv sync --extra amd`.
amd = [
    "torch>=2.7; sys_platform == 'linux'",
    # torch's own dependency; listed so that uv takes it from the ROCm index too
    "triton-rocm; sys_platform == 'linux'",
    "open3d>=0.19",
    "ninja",
    "jaxtyping",
    "rich>=12",
    "packaging",
    "setuptools",
    "wheel",
]
dev = ["pytest>=8"]

[project.scripts]
r2v = "r2v.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2v"]

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "amd" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "gpu" },
    { index = "pytorch-rocm", extra = "amd" },
]
triton-rocm = { index = "pytorch-rocm", extra = "amd" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Keep in step with the system ROCm (headers and hipcc compile gsplat against it).
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
